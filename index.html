<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baoka 拆卡</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
<style>
/* ===== Reset & Base ===== */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:#1a1025;color:#fff}
button{cursor:pointer;border:none;outline:none;font-family:inherit}
canvas{display:block}

/* ===== Color Tokens ===== */
:root{
  --cream:#FFF0F3;
  --pink:#FFD1DC;
  --pink-deep:#F4A6B8;
  --purple:#D4C5F9;
  --purple-deep:#9B7ED9;
  --silver:#E8E4F0;
  --silver-deep:#B0A8C8;
  --gold:#FFD700;
  --bg-deep:#1a1025;
  --bg-mid:#2a1a3e;
}

/* ===== Screens ===== */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s,visibility .5s}
.screen.hidden{opacity:0;visibility:hidden;pointer-events:none}

/* ===== Unbox Screen ===== */
#screen-unbox{
  background:radial-gradient(ellipse at 50% 30%, #3d2558 0%, #1a1025 70%);
}
.table{
  position:absolute;bottom:0;left:0;right:0;height:45%;
  background:linear-gradient(180deg, rgba(244,166,184,.15) 0%, rgba(212,197,249,.1) 100%);
  border-top:1px solid rgba(255,255,255,.08);
}
.title-area{position:absolute;top:8%;text-align:center;z-index:2}
.title-area h1{font-size:28px;font-weight:700;letter-spacing:4px;background:linear-gradient(135deg,#FFD1DC,#D4C5F9,#E8E4F0);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.title-area p{font-size:13px;color:rgba(255,255,255,.5);margin-top:8px;letter-spacing:2px}

/* Pack */
.pack-wrapper{position:relative;z-index:3;cursor-pointer;transition:transform .3s}
.pack{
  width:200px;height:290px;border-radius:12px;position:relative;
  background:linear-gradient(160deg,#FFD1DC 0%,#D4C5F9 50%,#E8E4F0 100%);
  box-shadow:0 20px 60px rgba(212,197,249,.3), inset 0 1px 0 rgba(255,255,255,.6);
  overflow:hidden;
  animation:packFloat 3s ease-in-out infinite;
}
.pack::before{
  content:'';position:absolute;inset:8px;border-radius:8px;
  border:1.5px solid rgba(255,255,255,.5);
}
.pack-top{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:3px;color:#7B5EA7;font-weight:600}
.pack-mid{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:80px;height:80px;border-radius:50%;
  background:radial-gradient(circle,#fff 0%,#FFD1DC 70%);
  display:flex;align-items:center;justify-content:center;
  font-size:36px;color:#9B7ED9;
  box-shadow:0 0 30px rgba(255,255,255,.5);
}
.pack-bottom{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-size:10px;color:#7B5EA7;letter-spacing:2px}
.pack-foil{
  position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.4) 50%,transparent 60%);
  animation:foilShine 3s ease-in-out infinite;
}
.pack.shaking{animation:packShake .5s ease-in-out}
.pack.torn .pack-top-half{transform:translateY(-120%) rotate(-10deg);opacity:0}
.pack.torn .pack-bottom-half{transform:translateY(120%) rotate(5deg);opacity:0}
.pack-half{position:absolute;left:0;right:0;height:50%;transition:all .6s ease-in-out;z-index:2}
.pack-half.top{top:0;border-bottom:2px dashed rgba(255,255,255,.6)}
.pack-half.bottom{bottom:0}

@keyframes packFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes foilShine{0%,100%{transform:translateX(-100%)}50%{transform:translateX(100%)}}
@keyframes packShake{
  0%,100%{transform:translate(0,0) rotate(0)}
  20%{transform:translate(-8px,4px) rotate(-3deg)}
  40%{transform:translate(8px,-4px) rotate(3deg)}
  60%{transform:translate(-6px,3px) rotate(-2deg)}
  80%{transform:translate(6px,-3px) rotate(2deg)}
}

.hint-text{position:absolute;bottom:12%;z-index:2;font-size:14px;color:rgba(255,255,255,.6);letter-spacing:1px;animation:hintPulse 2s ease-in-out infinite}
@keyframes hintPulse{0%,100%{opacity:.4}50%{opacity:1}}

/* Top bar buttons */
.top-bar{position:absolute;top:20px;right:20px;z-index:10;display:flex;gap:10px}
.top-btn{
  background:rgba(255,255,255,.1);backdrop-filter:blur(10px);
  color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;
  border:1px solid rgba(255,255,255,.15);transition:all .2s;
}
.top-btn:hover{background:rgba(255,255,255,.2)}

/* ===== Card Reveal Screen ===== */
#screen-reveal{background:radial-gradient(ellipse at center, #2a1a3e 0%, #1a1025 100%)}
.cards-stage{
  position:relative;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  perspective:1200px;
}
.card-fan{display:flex;gap:0;align-items:center;justify-content:center}
.card-slot{width:160px;height:225px;margin:0 -20px;position:relative;transform-style:preserve-3d;transition:transform .6s;cursor:pointer}
.card-slot:hover{transform:translateY(-20px) scale(1.05);z-index:10}
.card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.4,1.5,.6,1)}
.card-slot.flipped .card-inner{transform:rotateY(180deg)}
.card-face{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;
  overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.4);
}
.card-back{
  background:linear-gradient(160deg,#FFD1DC,#D4C5F9);
  display:flex;align-items:center;justify-content:center;
}
.card-back::before{content:'✦';font-size:48px;color:rgba(255,255,255,.7);text-shadow:0 0 20px rgba(255,255,255,.5)}
.card-back::after{
  content:'';position:absolute;inset:6px;border-radius:7px;
  border:1.5px solid rgba(255,255,255,.4);
}
.card-front{transform:rotateY(180deg)}

/* Card front design */
.cf-inner{width:100%;height:100%;padding:10px;display:flex;flex-direction:column;position:relative}
.cf-rarity{
  position:absolute;top:8px;right:8px;font-size:10px;font-weight:800;
  padding:2px 8px;border-radius:10px;letter-spacing:1px;z-index:5;
}
.cf-series{position:absolute;top:8px;left:8px;font-size:8px;opacity:.6;letter-spacing:1px;z-index:5}
.cf-art{
  flex:1;border-radius:6px;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.cf-art svg{width:60%;height:60%}
.cf-name{
  text-align:center;font-size:12px;font-weight:700;margin-top:8px;
  padding:4px;background:rgba(0,0,0,.2);border-radius:4px;letter-spacing:1px;
}
.cf-desc{font-size:8px;opacity:.7;margin-top:4px;text-align:center;line-height:1.3}

/* Rarity styles */
.rarity-N .cf-art{background:linear-gradient(135deg,#E8E4F0,#C8C0D8)}
.rarity-N .cf-rarity{background:#999;color:#fff}
.rarity-R .cf-art{background:linear-gradient(135deg,#B8D4F0,#8AB4E8)}
.rarity-R .cf-rarity{background:#4A90D9;color:#fff}
.rarity-SR .cf-art{background:linear-gradient(135deg,#D4A8E8,#9B59B6)}
.rarity-SR .cf-rarity{background:#8E44AD;color:#fff}
.rarity-SSR .cf-art{background:linear-gradient(135deg,#F4A6B8,#E8A0BF,#D4A5E8)}
.rarity-SSR .cf-rarity{background:linear-gradient(90deg,#FFD700,#FFA500);color:#333}
.rarity-SSR .cf-inner{border:2px solid #FFD700;box-shadow:0 0 20px rgba(255,215,0,.4)}
.rarity-UR .cf-art{background:linear-gradient(135deg,#FFD700,#FF6B9D,#C084FC,#60A5FA)}
.rarity-UR .cf-rarity{background:linear-gradient(90deg,#FFD700,#FF4444,#FFD700);color:#fff;animation:urGlow 1s ease-in-out infinite}
.rarity-UR .cf-inner{border:2px solid #FFD700;box-shadow:0 0 30px rgba(255,215,0,.6)}
.rarity-UR .cf-art::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.6) 50%,transparent 60%);
  animation:holoShine 2s ease-in-out infinite;
}
.rarity-SSR .cf-art::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.4) 50%,transparent 60%);
  animation:holoShine 2.5s ease-in-out infinite;
}
@keyframes holoShine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes urGlow{0%,100%{box-shadow:0 0 5px #FFD700}50%{box-shadow:0 0 20px #FFD700}}

/* Reveal result bar */
.result-bar{
  position:absolute;bottom:5%;left:50%;transform:translateX(-50%);
  display:flex;gap:12px;z-index:20;opacity:0;transition:opacity .5s;
}
.result-bar.show{opacity:1}
.result-btn{
  padding:12px 28px;border-radius:25px;font-size:14px;font-weight:600;
  transition:all .2s;letter-spacing:1px;
}
.btn-primary{background:linear-gradient(135deg,#F4A6B8,#D4C5F9);color:#3a2050}
.btn-primary:hover{transform:scale(1.05)}
.btn-secondary{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.2)}
.btn-secondary:hover{background:rgba(255,255,255,.25)}

/* Rarity announcement */
.rarity-announce{
  position:absolute;top:20%;left:50%;transform:translateX(-50%) scale(0);
  font-size:48px;font-weight:900;letter-spacing:8px;z-index:30;
  background:linear-gradient(135deg,#FFD700,#FF6B9D);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  transition:transform .5s cubic-bezier(.4,1.5,.6,1);
  text-shadow:none;filter:drop-shadow(0 0 30px rgba(255,215,0,.5));
}
.rarity-announce.show{transform:translateX(-50%) scale(1)}

/* ===== Gallery Screen ===== */
#screen-gallery{
  background:radial-gradient(ellipse at 50% 0%, #2a1a3e 0%, #1a1025 100%);
  overflow-y:auto;justify-content:flex-start;padding:80px 20px 40px;
}
.gallery-header{text-align:center;margin-bottom:24px;flex-shrink:0}
.gallery-header h2{font-size:22px;letter-spacing:3px;background:linear-gradient(135deg,#FFD1DC,#D4C5F9);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.gallery-stats{display:flex;gap:20px;justify-content:center;margin-top:12px;font-size:12px;color:rgba(255,255,255,.6)}
.gallery-stats span b{color:#FFD1DC;font-size:16px}

.series-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.series-tab{
  padding:6px 16px;border-radius:15px;font-size:12px;
  background:rgba(255,255,255,.08);color:rgba(255,255,255,.6);
  border:1px solid rgba(255,255,255,.1);transition:all .2s;
}
.series-tab.active{background:rgba(244,166,184,.3);color:#fff;border-color:rgba(244,166,184,.5)}

.card-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:14px;max-width:900px;width:100%;margin:0 auto;
}
.gallery-card{
  aspect-ratio:2/3;border-radius:8px;position:relative;overflow:hidden;
  transition:transform .2s;cursor:pointer;
}
.gallery-card:hover{transform:translateY(-4px)}
.gallery-card.locked{filter:grayscale(1) brightness(.3)}
.gallery-card .dup-badge{
  position:absolute;bottom:4px;right:4px;
  background:#F4A6B8;color:#3a2050;font-size:9px;font-weight:700;
  padding:2px 6px;border-radius:8px;z-index:5;
}
.gallery-card .card-mini{width:100%;height:100%;padding:6px;display:flex;flex-direction:column}
.gallery-card .card-mini .cm-art{flex:1;border-radius:4px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.gallery-card .card-mini .cm-art svg{width:50%;height:50%}
.gallery-card .card-mini .cm-name{font-size:8px;text-align:center;margin-top:4px;font-weight:600}
.gallery-card .card-mini .cm-rarity{position:absolute;top:4px;right:4px;font-size:8px;font-weight:800;padding:1px 5px;border-radius:6px}
.gallery-card .locked .cm-art::after{content:'???';position:absolute;font-size:16px;color:rgba(255,255,255,.3);font-weight:700}

/* History */
.history-section{max-width:600px;width:100%;margin:30px auto 0}
.history-section h3{font-size:14px;color:rgba(255,255,255,.6);margin-bottom:12px;letter-spacing:2px}
.history-item{
  background:rgba(255,255,255,.05);border-radius:8px;padding:10px 14px;
  margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;
  font-size:12px;
}
.history-item .h-cards{display:flex;gap:4px}
.history-item .h-dot{width:20px;height:28px;border-radius:3px}

/* Collection wall export */
.export-bar{max-width:600px;width:100%;margin:20px auto;display:flex;gap:10px;justify-content:center}

/* Particle canvas */
#particles{position:fixed;inset:0;pointer-events:none;z-index:100}

/* Toast */
.toast{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,.8);padding:12px 24px;border-radius:8px;
  font-size:14px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;
}
.toast.show{opacity:1}

/* Responsive */
@media(max-width:600px){
  .card-slot{width:110px;height:155px;margin:0:-15px}
  .pack{width:160px;height:230px}
  .card-grid{grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px}
  .rarity-announce{font-size:28px}
}
</style>
</head>
<body>

<!-- Particle canvas -->
<canvas id="particles"></canvas>

<!-- ===== Unbox Screen ===== -->
<div class="screen" id="screen-unbox">
  <div class="top-bar">
    <button class="top-btn" onclick="showScreen('gallery')">图鉴收藏</button>
  </div>
  <div class="title-area">
    <h1>BAOKA 拆卡</h1>
    <p>星梦 · 花语 · 梦境 三大系列</p>
  </div>
  <div class="table"></div>
  <div class="pack-wrapper" id="packWrapper" onclick="handlePackClick()">
    <div class="pack" id="pack">
      <div class="pack-foil"></div>
      <div class="pack-half top">
        <div class="pack-top">BAOKA</div>
      </div>
      <div class="pack-half bottom">
        <div class="pack-mid">✦</div>
        <div class="pack-bottom">STAR DREAM</div>
      </div>
    </div>
  </div>
  <div class="hint-text" id="hintText">点击卡包开始拆封</div>
</div>

<!-- ===== Reveal Screen ===== -->
<div class="screen hidden" id="screen-reveal">
  <div class="rarity-announce" id="rarityAnnounce"></div>
  <div class="cards-stage">
    <div class="card-fan" id="cardFan"></div>
  </div>
  <div class="result-bar" id="resultBar">
    <button class="result-btn btn-primary" onclick="showScreen('unbox');resetPack();">再拆一包</button>
    <button class="result-btn btn-secondary" onclick="showScreen('gallery')">查看图鉴</button>
  </div>
</div>

<!-- ===== Gallery Screen ===== -->
<div class="screen hidden" id="screen-gallery">
  <div class="top-bar">
    <button class="top-btn" onclick="showScreen('unbox')">← 返回拆包</button>
  </div>
  <div class="gallery-header">
    <h2>收藏图鉴</h2>
    <div class="gallery-stats">
      <span>已收集 <b id="statOwned">0</b>/30</span>
      <span>重复 <b id="statDup">0</b></span>
      <span>完成度 <b id="statPct">0%</b></span>
    </div>
  </div>
  <div class="series-tabs" id="seriesTabs">
    <button class="series-tab active" data-series="all" onclick="filterSeries('all')">全部</button>
    <button class="series-tab" data-series="star" onclick="filterSeries('star')">星梦系列</button>
    <button class="series-tab" data-series="flower" onclick="filterSeries('flower')">花语系列</button>
    <button class="series-tab" data-series="dream" onclick="filterSeries('dream')">梦境系列</button>
  </div>
  <div class="card-grid" id="cardGrid"></div>
  <div class="history-section">
    <h3>拆卡记录</h3>
    <div id="historyList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== Card Data =====
const SERIES = [
  {
    id: 'star', name: '星梦系列',
    cards: [
      {id:'st-n1', name:'流星的指引', rarity:'N', motif:'star-single', colors:['#C8C0D8','#E8E4F0'], desc:'划过夜空的流星，是星神写给人间的信。'},
      {id:'st-n2', name:'月光小径', rarity:'N', motif:'moon-crescent', colors:['#D4C5E8','#B8B0D0'], desc:'洒满银光的小径，通往梦境的入口。'},
      {id:'st-n3', name:'星尘碎片', rarity:'N', motif:'dust', colors:['#E0D8F0','#C0B8D8'], desc:'散落人间的星尘，收集起来就能许愿。'},
      {id:'st-r1', name:'银河旅人', rarity:'R', motif:'galaxy', colors:['#8AB4E8','#B8D4F0'], desc:'穿越银河的旅人，口袋里装着整个宇宙。'},
      {id:'st-r2', name:'彗星来信', rarity:'R', motif:'comet', colors:['#7AB8E0','#A0D0F0'], desc:'彗星拖尾的光，是来自遥远星系的问候。'},
      {id:'st-r3', name:'北极星之誓', rarity:'R', motif:'north-star', colors:['#90C0E8','#B0D8F0'], desc:'永不移动的星星，见证最坚定的誓言。'},
      {id:'st-sr1', name:'月亮公主', rarity:'SR', motif:'moon-princess', colors:['#9B59B6','#D4A8E8'], desc:'掌管潮汐与梦的月亮公主，温柔而神秘。'},
      {id:'st-sr2', name:'宇宙低语', rarity:'SR', motif:'universe', colors:['#8E44AD','#C890E0'], desc:'当你足够安静，就能听到宇宙的呼吸。'},
      {id:'st-ssr1', name:'银河女王', rarity:'SSR', motif:'galaxy-queen', colors:['#E8A0BF','#B088E0'], desc:'统治整片银河的女王，目光所及皆为星辰。'},
      {id:'st-ur1', name:'创世星神', rarity:'UR', motif:'creator', colors:['#FFD700','#FF6B9D'], desc:'从虚无中点亮第一颗星的原初之神。'},
    ]
  },
  {
    id: 'flower', name: '花语系列',
    cards: [
      {id:'fl-n1', name:'玫瑰初绽', rarity:'N', motif:'rose', colors:['#F0C8D0','#F8E0E4'], desc:'第一朵绽开的玫瑰，带着清晨的露珠。'},
      {id:'fl-n2', name:'薰衣草田', rarity:'N', motif:'lavender', colors:['#D0C8E8','#E0D8F0'], desc:'紫色花田随风起伏，像一片安静的海。'},
      {id:'fl-n3', name:'向日葵的微笑', rarity:'N', motif:'sunflower', colors:['#F0E0A0','#F8EFC0'], desc:'永远朝着太阳的花，笑容永远明亮。'},
      {id:'fl-r1', name:'樱花雨', rarity:'R', motif:'sakura', colors:['#F0B8C8','#F8D0DC'], desc:'花瓣如雨落下，每一瓣都是春天的信。'},
      {id:'fl-r2', name:'郁金香信笺', rarity:'R', motif:'tulip', colors:['#E8B8D0','#F0D0E4'], desc:'含苞的郁金香里藏着没说出口的话。'},
      {id:'fl-r3', name:'风信子的祝福', rarity:'R', motif:'hyacinth', colors:['#B8C8E8','#D0DCE8'], desc:'风信子开的时候，好运就不远了。'},
      {id:'fl-sr1', name:'牡丹皇后', rarity:'SR', motif:'peony', colors:['#D870A8','#F0B8D8'], desc:'花中之王，盛开时连蝴蝶都忘了飞。'},
      {id:'fl-sr2', name:'昙花一现', rarity:'SR', motif:'epiphyllum', colors:['#C0A8E0','#E0D0F0'], desc:'只为深夜绽放三小时，看过的人都被祝福。'},
      {id:'fl-ssr1', name:'花语精灵', rarity:'SSR', motif:'fairy', colors:['#F4A6B8','#D4A5E8'], desc:'听得懂每一朵花说话的小精灵。'},
      {id:'fl-ur1', name:'永恒花园', rarity:'UR', motif:'eternal-garden', colors:['#FFD700','#FF6B9D'], desc:'四季永不凋零的花园，时间在这里停住。'},
    ]
  },
  {
    id: 'dream', name: '梦境系列',
    cards: [
      {id:'dr-n1', name:'云朵棉花糖', rarity:'N', motif:'cloud', colors:['#E0E8F0','#F0F4F8'], desc:'天上的云其实是巨大的棉花糖。'},
      {id:'dr-n2', name:'彩虹桥', rarity:'N', motif:'rainbow', colors:['#F0D8E8','#E8D0F0'], desc:'彩虹尽头住着谁，只有梦里才知道。'},

const RARITY_LABELS = { N:'N', R:'R', SR:'SR', SSR:'SSR', UR:'UR' };

// ===== Audio =====
let audioCtx;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playTone(freq, dur, type='sine', vol=0.15) {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + dur);
  } catch(e) {}
}
function playShake() {
  for (let i = 0; i < 5; i++) setTimeout(() => playTone(200 + Math.random()*100, 0.08, 'triangle', 0.08), i*80);
}
function playTear() {
  playTone(150, 0.2, 'sawtooth', 0.1);
  setTimeout(() => playTone(300, 0.15, 'square', 0.08), 100);
}
function playFlip() { playTone(600, 0.08, 'sine', 0.12); }
function playSSR() {
  const notes = [523, 659, 784, 1047];
  notes.forEach((f, i) => setTimeout(() => playTone(f, 0.3, 'sine', 0.15), i*100));
}
function playUR() {
  const notes = [523, 659, 784, 1047, 1319, 1568];
  notes.forEach((f, i) => setTimeout(() => playTone(f, 0.4, 'triangle', 0.15), i*120));
}

// ===== Pack Flow =====
let packStage = 0; // 0=idle, 1=shaken, 2=torn

function handlePackClick() {
  getAudio();
  const pack = document.getElementById('pack');
  const hint = document.getElementById('hintText');
  if (packStage === 0) {
    pack.classList.add('shaking');
    playShake();
    hint.textContent = '再点一下撕开卡包';
    setTimeout(() => pack.classList.remove('shaking'), 500);
    packStage = 1;
  } else if (packStage === 1) {
    pack.classList.add('torn');
    playTear();
    packStage = 2;
    setTimeout(startReveal, 700);
  }
}

function resetPack() {
  packStage = 0;
  const pack = document.getElementById('pack');
  pack.classList.remove('torn', 'shaking');
  document.getElementById('hintText').textContent = '点击卡包开始拆封';
}

function rollCards() {
  const results = [];
  for (let i = 0; i < 5; i++) {
    let r = Math.random();
    let rarity = 'N';
    if (r < RARITY_RATES.UR) rarity = 'UR';
    else if (r < RARITY_RATES.UR + RARITY_RATES.SSR) rarity = 'SSR';
    else if (r < RARITY_RATES.UR + RARITY_RATES.SSR + RARITY_RATES.SR) rarity = 'SR';
    else if (r < RARITY_RATES.UR + RARITY_RATES.SSR + RARITY_RATES.SR + RARITY_RATES.R) rarity = 'R';
    const pool = ALL_CARDS.filter(c => c.rarity === rarity);
    results.push(pool[Math.floor(Math.random() * pool.length)]);
  }
  return results;
}

// ===== Reveal Logic =====
let revealedCount = 0;

function startReveal() {
  state.currentPull = rollCards();
  const fan = document.getElementById('cardFan');
  fan.innerHTML = '';
  revealedCount = 0;
  document.getElementById('resultBar').classList.remove('show');
  document.getElementById('rarityAnnounce').classList.remove('show');

  state.currentPull.forEach((card, i) => {
    const slot = document.createElement('div');
    slot.className = 'card-slot';
    slot.style.animationDelay = (i * 0.1) + 's';
    slot.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-back"></div>
        <div class="card-face card-front">
          <div class="cf-inner rarity-${card.rarity}" style="background:linear-gradient(160deg,${card.colors[0]},${card.colors[1]})">
            <div class="cf-series">${card.seriesName}</div>
            <div class="cf-rarity">${RARITY_LABELS[card.rarity]}</div>
            <div class="cf-art">${getMotifSVG(card.motif, card.colors)}</div>
            <div class="cf-name">${card.name}</div>
          </div>
        </div>
      </div>`;
    slot.onclick = () => flipCard(slot, card, i);
    fan.appendChild(slot);
  });

  showScreen('reveal');
}

function flipCard(slot, card, index) {
  if (slot.classList.contains('flipped')) return;
  slot.classList.add('flipped');
  playFlip();

  // Update collection
  if (!state.owned[card.id]) state.owned[card.id] = 0;
  state.owned[card.id]++;

  // Special effects for SSR/UR
  if (card.rarity === 'SSR' || card.rarity === 'UR') {
    const announce = document.getElementById('rarityAnnounce');
    announce.textContent = card.rarity + '!';
    announce.classList.add('show');
    if (card.rarity === 'SSR') playSSR(); else playUR();
    burstParticles(card.rarity === 'UR' ? 150 : 80);
    setTimeout(() => announce.classList.remove('show'), 1500);
  }

  revealedCount++;
  if (revealedCount === 5) {
    // Record history
    state.history.unshift({
      time: new Date().toLocaleString('zh-CN', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}),
      cards: state.currentPull.map(c => c.id)
    });
    if (state.history.length > 20) state.history = state.history.slice(0, 20);
    save();
    setTimeout(() => document.getElementById('resultBar').classList.add('show'), 600);
  }
}

// ===== Particles =====
const pCanvas = document.getElementById('particles');
const pCtx = pCanvas.getContext('2d');
let particles = [];
function resizeCanvas() { pCanvas.width = innerWidth; pCanvas.height = innerHeight; }
resizeCanvas(); window.addEventListener('resize', resizeCanvas);

function burstParticles(count) {
  const cx = innerWidth / 2, cy = innerHeight / 2;
  const colors = ['#FFD700', '#FF6B9D', '#D4C5F9', '#FFD1DC', '#fff', '#C084FC'];
  for (let i = 0; i < count; i++) {
    particles.push({
      x: cx, y: cy,
      vx: (Math.random() - 0.5) * 12,
      vy: (Math.random() - 0.5) * 12 - 3,
      r: Math.random() * 4 + 2,
      color: colors[Math.floor(Math.random() * colors.length)],
      life: 1, decay: 0.01 + Math.random() * 0.02,
      rotation: Math.random() * Math.PI,
    });
  }
  if (!pAnimRunning) animateParticles();
}
let pAnimRunning = false;
function animateParticles() {
  pAnimRunning = true;
  pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.15;
    p.life -= p.decay; p.rotation += 0.05;
    pCtx.save();
    pCtx.globalAlpha = p.life;
    pCtx.translate(p.x, p.y);
    pCtx.rotate(p.rotation);
    pCtx.fillStyle = p.color;
    pCtx.shadowBlur = 10; pCtx.shadowColor = p.color;
    pCtx.fillRect(-p.r/2, -p.r/2, p.r, p.r);
    pCtx.restore();
  });
  if (particles.length > 0) requestAnimationFrame(animateParticles);
  else { pAnimRunning = false; pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height); }
}

    const dots = h.cards.map(cid => {
      const c = ALL_CARDS.find(x => x.id === cid);
      const bg = c ? `linear-gradient(135deg,${c.colors[0]},${c.colors[1]})` : '#333';
      return `<div class="h-dot" style="background:${bg}" title="${c?.name || ''}"></div>`;
    }).join('');
    item.innerHTML = `<span style="opacity:.5">${h.time}</span><div class="h-cards">${dots}</div>`;
    histEl.appendChild(item);
  });
}

// ===== Save Card as Image =====
function saveCardAsImage(card) {
  // Create a temp canvas and draw the card
  const canvas = document.createElement('canvas');
  canvas.width = 400; canvas.height = 560;
  const ctx = canvas.getContext('2d');

  // Background gradient
  const grad = ctx.createLinearGradient(0, 0, 400, 560);
  grad.addColorStop(0, card.colors[0]);
  grad.addColorStop(1, card.colors[1]);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 400, 560);

  // Border
  ctx.strokeStyle = card.rarity === 'UR' ? '#FFD700' : card.rarity === 'SSR' ? '#FFD700' : 'rgba(255,255,255,.4)';
  ctx.lineWidth = card.rarity === 'N' || card.rarity === 'R' ? 2 : 4;
  ctx.strokeRect(10, 10, 380, 540);

  // Rarity badge
  ctx.fillStyle = card.rarity === 'UR' ? '#FFD700' : card.rarity === 'SSR' ? '#FFD700' : card.rarity === 'SR' ? '#8E44AD' : card.rarity === 'R' ? '#4A90D9' : '#999';
  ctx.beginPath();
  ctx.roundRect(290, 25, 80, 30, 15);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(card.rarity, 330, 45);

  // Series name
  ctx.fillStyle = 'rgba(255,255,255,.7)';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(card.seriesName, 25, 45);

  // Draw motif as simple shape
  ctx.save();
  ctx.translate(200, 260);
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  if (card.motif.includes('star') || card.motif.includes('north')) {
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = (i * 4 * Math.PI) / 5 - Math.PI / 2;
      const r = 80;
      ctx[i === 0 ? 'moveTo' : 'lineTo'](Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath(); ctx.fill();
  } else if (card.motif.includes('moon')) {
    ctx.beginPath(); ctx.arc(0, 0, 70, 0, Math.PI * 2); ctx.fill();
  } else if (card.motif.includes('flower') || card.motif.includes('rose') || card.motif.includes('sakura') || card.motif.includes('peony') || card.motif.includes('tulip') || card.motif.includes('hyacinth') || card.motif.includes('lavender') || card.motif.includes('sunflower')) {
    for (let i = 0; i < 6; i++) {
      ctx.save();
      ctx.rotate((i * Math.PI) / 3);
      ctx.beginPath();
      ctx.ellipse(0, -50, 25, 40, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    ctx.beginPath(); ctx.arc(0, 0, 25, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(0, 0, 60, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  // Name
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(card.name, 200, 480);

  // Desc
  ctx.fillStyle = 'rgba(255,255,255,.7)';
  ctx.font = '12px sans-serif';
  ctx.fillText(card.desc, 200, 510, 350);

  // Download
  const link = document.createElement('a');
  link.download = `${card.name}_${card.rarity}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
  showToast('已保存卡片图片');
}

// ===== Navigation =====
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  document.getElementById('screen-' + name).classList.remove('hidden');
  if (name === 'gallery') renderGallery();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}
